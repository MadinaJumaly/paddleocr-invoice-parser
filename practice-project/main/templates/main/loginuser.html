
{% load static %}
{% block content %}
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <h2>Войти</h2>
        </div>
    </div>
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">ИИН</label>
                    <input type="text" name="username" class="form-control" id="username">
                </div>
                <div class="form-group">
                    <label for="password">Пороль</label>
                    <input type="password" name="password" class="form-control" id="password">
                </div>
                <p></p>
                <button id="submit" class="btn btn-primary">Вход</button>
            </form>
            <hr>
            <div class="text-center">
                У Вас нет аккаунта? <a href="{% url 'signupuser' %}">Зарегистрироваться</a>
            </div>
        </div>
    </div>
{% endblock %}
